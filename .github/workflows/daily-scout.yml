name: Daily Internship Scout

on:
  schedule:
    # Runs daily at 08:00 UTC (13:30 IST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no emails/WhatsApp sent)?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Internship Scout
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ENABLE_EMAIL_NOTIFICATION: ${{ secrets.ENABLE_EMAIL_NOTIFICATION || 'true' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          ENABLE_WHATSAPP_NOTIFICATION: ${{ secrets.ENABLE_WHATSAPP_NOTIFICATION || 'false' }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SCRAPE_KEYWORDS: ${{ secrets.SCRAPE_KEYWORDS || 'intern,internship,software intern,junior developer' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jobs.db [skip ci]"
          file_pattern: "jobs.db"
